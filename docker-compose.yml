services:
  atlas-postgres:
    image: postgres:15-alpine
    container_name: atlas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${PORT_POSTGRES:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/dump-atlas.sql:/tmp/dump-atlas.sql:ro
      - ./sql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - atlas-network
    restart: unless-stopped

  atlas-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-backend
    hostname: atlas-api
    environment:
      - PORT=4000
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@atlas-postgres:5432/${POSTGRES_DB:-atlas}
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID:-}
      - ENTRA_AUDIENCE=${ENTRA_AUDIENCE:-}
      - ENTRA_ISSUER=${ENTRA_ISSUER:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3350,http://localhost:5173}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-atlas}:${RABBITMQ_PASS:-atlas123}@rabbitmq-node1:5672
    ports:
      - "${PORT_BACKEND:-4450}:4000"
    depends_on:
      atlas-postgres:
        condition: service_healthy
      rabbitmq-node1:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - atlas-network
    restart: unless-stopped

  rabbitmq-node1:
    image: rabbitmq:4-management
    container_name: rabbitmq-node1
    hostname: rmq1
    environment:
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE:-AtlasErlangCookie}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-atlas}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-atlas123}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_node1_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - atlas-network
    restart: unless-stopped

  rabbitmq-node2:
    image: rabbitmq:4-management
    container_name: rabbitmq-node2
    hostname: rmq2
    environment:
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE:-AtlasErlangCookie}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-atlas}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-atlas123}
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_node2_data:/var/lib/rabbitmq
    depends_on:
      rabbitmq-node1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - atlas-network
    restart: unless-stopped

  atlas-consumer:
    build:
      context: ./CONSUMER
      dockerfile: Dockerfile
    container_name: atlas-consumer
    hostname: atlas-consumer
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-atlas}:${RABBITMQ_PASS:-atlas123}@rabbitmq-node1:5672
      - LOG_DIR=/app/logs
    volumes:
      - ./CONSUMER/logs:/app/logs
    depends_on:
      rabbitmq-node1:
        condition: service_healthy
    networks:
      - atlas-network
    restart: unless-stopped

  atlas-admin:
    build:
      context: ./ADMIN
      dockerfile: Dockerfile
    container_name: atlas-admin
    hostname: atlas-admin
    environment:
      - PORT=4500
      - RABBITMQ_MGMT_URL=http://rabbitmq-node1:15672
      - RABBITMQ_USER=${RABBITMQ_USER:-atlas}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-atlas123}
    ports:
      - "${PORT_ADMIN:-4500}:4500"
    depends_on:
      rabbitmq-node1:
        condition: service_healthy
    networks:
      - atlas-network
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_node1_data:
  rabbitmq_node2_data:

networks:
  atlas-network:
    driver: bridge
    name: atlas-network
