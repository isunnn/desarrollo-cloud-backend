services:
  atlas-postgres:
    image: postgres:15-alpine
    container_name: atlas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${PORT_POSTGRES:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/dump-atlas.sql:/tmp/dump-atlas.sql:ro
      - ./sql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - atlas-network
    restart: unless-stopped

  atlas-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-backend
    hostname: atlas-api
    environment:
      - PORT=4000
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@atlas-postgres:5432/${POSTGRES_DB:-atlas}
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID:-}
      - ENTRA_AUDIENCE=${ENTRA_AUDIENCE:-}
      - ENTRA_ISSUER=${ENTRA_ISSUER:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3350,http://localhost:5173}
    ports:
      - "${PORT_BACKEND:-4450}:4000"
    depends_on:
      atlas-postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - atlas-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  atlas-network:
    driver: bridge
    name: atlas-network
